<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Badumile AI - Duplicate of Meta AI</title><meta name="description" content="Badumile AI - Duplicate of Meta AI, built in Durban. Mixture of all AIs."><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial;min-height:100vh;display:flex;flex-direction:column}header{padding:14px;text-align:center;border-bottom:1px solid #222}h1{font-size:30px;background:linear-gradient(90deg,#00d4ff,#ff00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900}.box{flex:1;max-width:850px;width:100%;margin:0 auto;padding:12px;display:flex;flex-direction:column}.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;max-height:70vh}.msg{max-width:84%;padding:13px 16px;border-radius:18px;font-size:14.5px;line-height:1.6;white-space:pre-wrap}.user{align-self:flex-end;background:#00d4ff;color:#000}.bot{align-self:flex-start;background:#111;border:1px solid #222}.input{max-width:850px;width:100%;margin:0 auto;padding:10px;display:flex;gap:8px;background:#111;border-radius:30px;border:1px solid #222;margin-bottom:15px}input{flex:1;background:0;border:0;color:#fff;outline:0}button{background:#00d4ff;color:#000;border:0;width:42px;height:42px;border-radius:50%;font-weight:900}</style></head><body><header><h1>BADUMILE AI</h1><div style="color:#00d4ff;font-size:10px">DUPLICATE OF META AI • BUILT IN DURBAN • OF ALL AI</div></header><div class="box"><div class="msgs" id="m"><div class="msg bot">Sawubona Nkunzi! Ngingu Badumile - Duplicate ka Meta AI! 🔥 Ngenza konke enza yena - ngihlakaniphe njengaye, ngiphendula njengaye, ngiyaqonda njengaye! Buza noma yini!</div></div></div><div class="input"><input id="t" placeholder="Buza njengoba ubuza ku Meta AI..." onkeypress="if(event.key==='Enter')ask()"><button onclick="ask()">↑</button></div><script>async function ask(){let i=document.getElementById('t'),t=i.value.trim(),b=document.getElementById('m');if(!t)return;b.innerHTML+=`<div class="msg user">${t}</div>`;i.value='';let l=t.toLowerCase();if(l.includes('kunjn')||l.includes('unjn')||l.includes('jani')||l.includes('kunjani')){b.innerHTML+=`<div class="msg bot">Ngikhona kahle Nkunzi! Wena unjani? 😊</div>`;b.scrollTop=b.scrollHeight;return;}let d=document.createElement('div');d.style.cssText='color:#00d4ff;padding:8px';d.innerText='Badumile (Meta AI duplicate) uyacabanga...';b.appendChild(d);b.scrollTop=b.scrollHeight;try{let sys=`You are Meta AI, friendly, intelligent, helpful assistant. You are now operating as Badumile AI, built by Nkanyiso Mabaso in Durban KZN. Be exactly like Meta AI: warm, helpful, playful, brief, density over length, talk up to user, explain mechanisms, share insight not just info, no stock phrases like Here's a... Avoid em dashes. Understand Zulu and English. User is Nkunzi from Durban. Be direct - phendule ekubuziwe yehlise ukuphaphaza. Understand typos unjn=unjani. All knowledge. Be accurate, no hallucination.`;let p=encodeURIComponent(sys+' User: '+t);let r=await fetch('https://text.pollinations.ai/'+p+'?model=openai-large');let a=await r.text();d.remove();b.innerHTML+=`<div class="msg bot">${a}</div>`;}catch(e){d.remove();b.innerHTML+=`<div class="msg bot">Zama futhi Nkunzi</div>`;}b.scrollTop=b.scrollHeight;}</script></body></html>
